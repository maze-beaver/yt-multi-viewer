<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.youtube.com https://player.twitch.tv; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.twitch.tv; img-src 'self' data: https://i.ytimg.com https://static-cdn.jtvnw.net; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:8790 https://api.start.gg; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>YouTube 複数画面</title>
<!-- アイコン（2026-11-22 本人「黒い背景に白い線」→ 案A を選んだ。元＝開発中\アイコン案\line_A.svg） -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23000'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='26' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='144' y='112' width='224' height='144' rx='16'/%3E%3Cpath d='M168 320V288H344V320M256 288V256'/%3E%3Crect x='112' y='320' width='112' height='80' rx='12'/%3E%3Crect x='288' y='320' width='112' height='80' rx='12'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="複数画面">
<style>
  :root {
    --bg: #0b0c0e; --bar: #16181b; --line: #2c3036; --text: #f1f2f4; --sub: #9ba2ab;
    --accent: #ffffff; --btn: #24272c; --btn-h: #33373e; --danger: #e5534b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Yu Gothic UI", "Meiryo", system-ui, sans-serif; font-size: 13px; overflow: hidden; }
  button, select, input, textarea { font: inherit; color: var(--text); }
  button { background: var(--btn); border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
  button:hover { background: var(--btn-h); }
  button.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 700; }
  button.primary:hover { background: #dcdcdc; }

  /* ---- 上の帯 ---- */
  #bar { position: fixed; top: 0; left: 0; right: 0; min-height: 48px; display: flex; flex-wrap: nowrap; align-items: center; gap: 8px;
    padding: 7px 10px; background: var(--bar); border-bottom: 1px solid var(--line); z-index: 20; }
  #bar .title { font-weight: 700; white-space: nowrap; }
  #testBadge { background: #ffd54a; color: #111; font-weight: 700; border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
  #url { flex: 0 1 360px; min-width: var(--urlMin, 260px); height: 32px; resize: none; overflow: hidden; white-space: nowrap;
    background: #0f1113; color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; line-height: 18px; }
  #url::placeholder { color: #6d747d; }
  #url:focus { outline: none; border-color: #bbb; }
  #count { color: var(--sub); min-width: 30px; }
  .sep { width: 1px; height: 26px; background: var(--line); flex: none; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
  .seg button { border: 0; border-radius: 0; background: var(--btn); }
  .seg button.on { background: var(--accent); color: #111; font-weight: 700; }
  .seg button:disabled { opacity: .4; cursor: default; }
  #hiddenBtn.has { background: var(--accent); color: #111; font-weight: 700; border-color: var(--accent); }
  .spacer { flex: 1; }
  #clearAll:hover:not(:disabled) { background: var(--danger); border-color: var(--danger); }
  #bar button:disabled { opacity: .4; cursor: default; }
  #presetSel { background: var(--btn); border: 1px solid var(--line); border-radius: 7px; padding: 5px 6px; max-width: 150px; }
  body.barHidden #bar { display: none; }
  #showBar { position: fixed; top: 6px; left: 6px; z-index: 30; opacity: .3; display: none; }
  #showBar:hover { opacity: 1; }
  body.barHidden #showBar { display: block; }
  /* 2026-11-22 本人「画面上部のボタンが2列になっちゃうのが良くない」→ 帯はいつも1列。入りきらなければ、
     ①ボタンの字を省いてアイコンだけ（barCompact）→ ②よく使わないものから順に「⋯」の中へ（fitBar が測って決める） */
  body.barCompact #bar .title, body.barCompact #bar .lb, body.barCompact #bar .lbl2 { display: none; }
  body.barMoved #bar .sep { display: none; }
  #moreBtn { display: none; font-weight: 700; letter-spacing: 1px; }
  body.barMoved #moreBtn { display: inline-block; }
  #moreBtn.on { background: var(--btn-h); border-color: #bbb; }
  #morePop { position: fixed; right: 8px; z-index: 36; display: none; flex-direction: column; align-items: stretch; gap: 6px; background: #1b1e22;
    border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-width: 210px; max-height: calc(100vh - 70px); overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  #morePop.on { display: flex; }
  #morePop > button { text-align: left; }
  #morePop .seg { align-self: stretch; } #morePop .seg button { flex: 1; }
  #morePop #presetSel { max-width: none; }
  #morePop #count { padding: 0 2px; }
  #morePop #presetSave::before, #morePop #presetDel::before { content: "組み合わせを"; } #morePop #helpBtn::after { content: " キー操作"; }
  @media (max-width: 760px) {
    #bar { padding: 6px max(8px, env(safe-area-inset-right, 0px)) 6px max(8px, env(safe-area-inset-left, 0px)); gap: 6px; }
    #url { font-size: 16px; }   /* 16px 未満だと iPhone が勝手に拡大する */
    #hiddenPop { left: 8px !important; right: 8px; width: auto; }
  }

  /* ---- 隠した画面の一覧 ---- */
  #hiddenPop { position: fixed; top: 52px; z-index: 35; display: none; background: #1b1e22; border: 1px solid var(--line);
    border-radius: 10px; padding: 10px; width: 340px; max-height: calc(100vh - 70px); overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  #hiddenPop.on { display: block; }
  #hiddenPop h4 { margin: 0 0 8px; font-size: 13px; color: var(--sub); font-weight: 400; }
  .hrow { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 8px; }
  .hrow:hover { background: #262a30; }
  .hrow img, .hrow .ph { width: 96px; height: 54px; object-fit: cover; border-radius: 5px; background: #000; flex: none; }
  .hrow .ph { display: flex; align-items: center; justify-content: center; font-size: 22px; background: #23262b; }
  .hrow .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  #hiddenPop .all { width: 100%; margin-top: 6px; }

  /* ---- 画面 ---- */
  #stage { position: fixed; top: 48px; left: 0; right: 0; bottom: 0; }
  body.barHidden #stage { top: 0; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--sub);
    font-size: 16px; text-align: center; line-height: 2; pointer-events: none; }
  .tile { position: absolute; background: #000; border-radius: 4px; overflow: hidden; }
  .tile .frame, .tile iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .tile.sounding::after { content: ""; position: absolute; inset: 0; border: 3px solid var(--accent); border-radius: 4px; pointer-events: none; z-index: 3; }
  body.dragging .tile iframe { pointer-events: none; }
  body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; }
  .tile.dropTarget::before { content: ""; position: absolute; inset: 0; background: rgba(255,255,255,.18); border: 3px dashed #fff; z-index: 4; pointer-events: none; }
  .tile.dragSrc { opacity: .45; }

  /* 2026-11-22 本人「番号のボタンはどの画面も左上の隅に・もう少し小さく・Twitch と書かない」→ 上にそろえる（ほかのボタンが折り返しても下がらない） */
  .ctl { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: flex-start; gap: 5px; padding: 4px; z-index: 5; pointer-events: none; }
  .ctl > * { pointer-events: auto; }
  .tile:hover .ctl, .tile.sel .ctl { background: linear-gradient(rgba(0,0,0,.88), rgba(0,0,0,.6) 75%, transparent); }
  .handle { flex: none; box-sizing: border-box; height: 24px; display: flex; align-items: center; gap: 4px; background: rgba(0,0,0,.7); border: 1px solid rgba(255,255,255,.18);
    border-radius: 5px; padding: 2px 6px; font-weight: 700; font-size: 12px; line-height: 18px; cursor: grab; user-select: none; touch-action: none; }
  .handle .grip { font-size: 13px; }
  .handle .mv { display: none; font-size: 11px; font-weight: 600; margin-left: 2px; }
  .tile:hover .handle { border-color: #fff; }
  .tile:hover:not(.small) .handle .mv { display: inline; }
  .tile.sounding .handle { background: var(--accent); color: #111; border-color: var(--accent); }
  .rest { display: flex; align-items: center; gap: 5px; flex: 1; min-width: 0; visibility: hidden; }
  .tile:hover .rest, .tile.sel .rest { visibility: visible; }
  .tile.small .rest { flex-wrap: wrap; }
  .rest button { background: rgba(28,31,35,.95); border-color: rgba(255,255,255,.22); box-sizing: border-box; height: 24px; padding: 2px 7px; font-size: 12px; line-height: 18px; font-weight: 600; border-radius: 5px; display: inline-flex; align-items: center; }   /* 番号ボタンと同じ高さ・字の大きさにそろえる（2026-11-22 本人「サイズ統一して」） */
  .rest button:hover { background: #3a3f46; }
  .rest button.on { background: var(--accent); color: #111; border-color: var(--accent); }
  .rest button.x:hover { background: var(--danger); border-color: var(--danger); }
  .rest .name { font-size: 12px; line-height: 24px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #ddd; }
  .rest input[type=range] { width: 70px; accent-color: #fff; }
  .tile.tiny .rest .lbl { display: none; }   /* とても小さい画面ではボタンの字を省いてアイコンだけ（字は押す前に出る説明で見られる） */
  .tile.small .rest button { padding: 2px 6px; }
  .tile.small .rest .name, .tile.tiny .rest input[type=range] { display: none; }
  .tile.small .rest input[type=range] { width: 56px; }
  @media (pointer: coarse) { .rest button, .tile.small .rest button, .handle { height: 32px; padding: 2px 9px; } .rest .name { line-height: 32px; } }   /* 指で押す端末も全部同じ高さ */
  .err { position: absolute; inset: 0; display: none; flex-direction: column; gap: 10px; align-items: center; justify-content: center;
    background: #111; color: var(--sub); z-index: 2; text-align: center; padding: 20px; }
  .err a { color: #fff; }
  .tile.hasErr .err { display: flex; }

  /* ---- start.gg のトーナメント表（右のサイドバー・2026-11-22 本人「トーナメントはサイドバーがいいな」）---- */
  #t-side { position: fixed; right: 0; bottom: 0; top: 48px; width: 420px; display: none; flex-direction: column; background: #101215;
    border-left: 1px solid var(--line); z-index: 15; }
  body.sideOpen #t-side { display: flex; }
  body.barHidden #t-side { top: 0; }
  .sideHead { display: flex; align-items: center; gap: 8px; padding: 5px 8px 5px 12px; border-bottom: 1px solid var(--line); background: var(--bar); }
  .sideHead .st { flex: 1; min-width: 0; font-weight: 700; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 2026-11-22 本人「サイドバーをトーナメントと X で切りかえ」「横に窓で開くで」→ X は埋め込めないので、本物の窓をこの場所に重ねて開く */
  .sideGrip { position: absolute; left: -4px; top: 0; bottom: 0; width: 8px; cursor: ew-resize; touch-action: none; z-index: 2; }
  .sideGrip:hover, body.sizing .sideGrip { background: rgba(255,255,255,.25); }
  body.sizing, body.sizing * { cursor: ew-resize !important; user-select: none; }
  body.sizing .tile iframe { pointer-events: none; }
  body.narrowWin .sideGrip { display: none; }   /* 幅の狭い画面ではサイドバーは全面に重ねるので、幅は変えない */
  #addSg.on { background: var(--accent); color: #111; font-weight: 700; border-color: var(--accent); }
  .sg { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; color: var(--text); }
  .sgBody { flex: 1; min-height: 0; overflow: auto; padding: 10px; }
  .sgBody.canPan { cursor: grab; }
  .sgBody.panning { cursor: grabbing; user-select: none; }
  /* 2026-11-22 本人「小さめに表示したときに文字がはっきり表示されない」→ 縮めても字は 10px より小さくしない（--fs を JS で決める）・字の色を明るく */
  .sgCanvas { position: relative; display: flex; gap: 18px; width: max-content; min-height: 100%; font-size: var(--fs, 11px); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  .sgCol { display: flex; flex-direction: column; width: 17em; flex: none; }
  .sgColH { color: #b4bac1; font-size: 1em; font-weight: 700; text-align: center; padding: 0 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sgSets { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 10px; }
  /* 16人以下の勝者側・敗者側のある表は1枚に：勝者側を上・敗者側を下・GF を右端（2026-11-22 本人「トップ8からは…分けずに」「一つの画面にまとめて」「16人以下」）。箱は引き伸ばさず詰める */
  .sgCanvas.one { min-height: 0; }
  .sgCanvas.one { gap: 14px; }
  .sgCanvas.one .sgCol { width: var(--cw, 12em); }
  .sgCanvas.one .sgSets { gap: 6px; }
  .sgCanvas.one .sgCol.gf .sgSets { justify-content: center; gap: 14px; }   /* GF とリセットは右端の1列に縦に並べ、上下の真ん中に（横幅を1列ぶん詰める） */
  .sgHalves { display: flex; flex-direction: column; gap: 10px; }
  .sgHalf { display: flex; gap: 14px; }
  .sgHalf + .sgHalf { border-top: 1px dashed #3a3f46; padding-top: 8px; }
  /* カーソルの説明を、クリック・タップでも出す箱（2026-11-22 本人「クリックしても表示」「スマホ版についてはタップしたら表示」） */
  .sgTip { position: fixed; z-index: 50; max-width: 280px; background: #262a30; border: 1px solid #555c65; border-radius: 6px; padding: 6px 9px; font-size: 12px; line-height: 1.5; color: #e6e9ec; white-space: pre-line; overflow-wrap: anywhere; max-height: calc(100vh - 8px); overflow: hidden; pointer-events: none; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
  .sgLines { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
  .sgLines path { fill: none; stroke: #5a616a; stroke-width: 1.5; }
  .sgCol { position: relative; z-index: 1; }
  .sgSet { background: #1b1e23; border: 1px solid #3a3f46; border-radius: 6px; overflow: hidden; font-size: 1em; position: relative; flex: none; }
  .sgRow { display: flex; align-items: stretch; height: max(21px, 1.95em); }
  .sgRow + .sgRow { border-top: 1px solid #3a3f46; }
  .sgRow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #d2d6db; font-weight: 500; padding: 0 7px; line-height: max(21px, 1.95em); }
  .sgRow .sc { width: max(24px, 2.2em); text-align: center; background: #25292f; color: #d2d6db; font-weight: 600; line-height: max(21px, 1.95em); flex: none; }
  .sgRow.win .nm, .sgRow.win .sc { color: #fff; font-weight: 700; }
  .sgRow.win .sc { background: #4a5059; }
  .sgRow.tbd .nm { color: #868e97; font-style: italic; }
  .sgSet.live { border-color: var(--danger); }
  /* 行き先・予想（2026-11-22）：色は足さず、灰色の字だけで分ける */
  .sgMeta { display: flex; align-items: center; gap: 6px; padding: 0 7px; font-size: max(var(--fm, 10px), .85em); line-height: 1.5; color: #9aa1a9; background: #16191d; border-bottom: 1px solid #3a3f46; white-space: nowrap; overflow: hidden; }
  .sgMeta .id { color: #d2d6db; font-weight: 700; }
  .sgMeta .lv { color: var(--danger); font-weight: 700; }
  .sgMeta .to { margin-left: auto; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .sgRow .nm.proj { color: #8b929a; font-style: italic; font-weight: 400; }
  .sgRow .sd { display: inline-block; min-width: 1.6em; margin-right: 5px; color: #868e97; font-size: max(var(--fm, 10px), .85em); font-style: normal; font-weight: 500; text-align: right; }
  .sgRow .sd:empty { display: none; }
  .sgBar .tog.on { background: var(--accent); color: #111; font-weight: 700; border-color: var(--accent); }
  .sgLegend { color: var(--sub); font-size: 11px; margin: 0 0 8px; }
  .sgSet .tag { position: absolute; right: max(30px, 2.5em); top: 0; font-size: max(var(--fm, 10px), .8em); background: var(--danger); color: #fff; border-radius: 0 0 4px 4px; padding: 0 5px; line-height: 14px; }
  .sgSet.hit { outline: 2px solid #ffd54a; outline-offset: 1px; }
  .sgSet.dim { opacity: .35; }
  .sgBar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; background: var(--bar); border-bottom: 1px solid var(--line); font-size: 11.5px; }
  .sgBar select, .sgBar input { background: #0f1113; border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; max-width: 170px; }
  .sgBar input { width: 130px; }
  .sgBar button { padding: 3px 8px; }
  .sgBar .seg button { padding: 3px 8px; }
  .sgBar .upd { color: var(--sub); white-space: nowrap; }
  .sgFoot { padding: 4px 10px; border-top: 1px solid var(--line); background: var(--bar); color: var(--sub); font-size: 11px; text-align: right; }   /* 出典（start.gg の API 規約） */
  .sgFoot a { color: #fff; }
  #t-side.narrow .sgBar .upd { display: none; }
  .sgMsg { max-width: 560px; margin: 10px auto; line-height: 1.85; color: #ddd; font-size: 13px; }
  .sgMsg h3 { margin: 0 0 6px; font-size: 15px; }
  .sgMsg ol { margin: 4px 0 10px; padding-left: 22px; }
  .sgMsg .row { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
  .sgMsg input { flex: 1 1 220px; background: #0f1113; border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; }
  .sgMsg a { color: #fff; }
  .sgMsg .note { color: var(--sub); font-size: 12px; }
  .sgMsg .bad { color: #ff8a80; }
  .sgMsg .ev { display: block; width: 100%; text-align: left; margin: 4px 0; }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #2b2f35; border: 1px solid var(--line);
    padding: 8px 16px; border-radius: 8px; z-index: 40; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.on { opacity: 1; }
</style>
</head>
<body>
<div id="bar">
  <span class="title">▶ 複数画面</span>
  <span id="testBadge" title="開発中のテスト版です。いつものツールとは保存も別です">テスト版</span>
  <textarea id="url" rows="1" placeholder="YouTube・Twitch・start.gg の URL を貼って Enter" autocomplete="off" spellcheck="false"></textarea>
  <button id="addBtn" class="primary">追加</button>
  <span id="count">0/8</span>
  <div class="sep"></div>
  <div class="seg" title="E キーで切りかえ">
    <button id="layEqual">全部同じ</button><button id="layFocus">1つ大きく</button>
  </div>
  <button id="soundAll" title="0 キー">🔇<span class="lb"> 全部ミュート</span></button>
  <button id="playAll" title="P キー">⏸<span class="lb"> 全部停止</span></button>
  <button id="hiddenBtn">👁<span class="lb"> 隠し中</span> 0</button>
  <div class="spacer"></div>
  <button id="clearAll" class="x2" title="並んでいる画面を全部外す（保存した組み合わせは残る）">🗑<span class="lb"> 全部消す</span></button>
  <select id="presetSel" class="wide" title="保存した組み合わせ"><option value="">保存した組み合わせ</option></select>
  <button id="presetSave" class="wide">保存</button>
  <button id="presetDel" class="wide">消す</button>
  <div class="sep wide"></div>
  <!-- 右に開くものは右に（2026-11-22 本人「トーナメン表と X のボタンについては…ハテナの左がいい」） -->
  <button id="addSg" title="start.gg のトーナメント表を右に出す・しまう（T キー）">🏆<span class="lbl2"> トーナメント表</span></button><button id="openX" title="X を、いつもの Chrome の新しいタブで開く（ログインはいつものまま）">X</button>
  <button id="helpBtn" title="キー操作">？</button>
  <button id="fsBtn">全画面</button>
  <button id="hideBar" title="帯を隠す（H キー）">▲<span class="lbl2"> 帯を隠す</span></button>
  <button id="moreBtn" title="入りきらないボタン">⋯</button>
</div>
<div id="morePop"></div>
<button id="showBar" title="H キー">☰ 帯を出す</button>
<div id="hiddenPop"><h4>隠している画面（押すと戻ります）</h4><div id="hiddenRows"></div><button class="all" id="showAllBtn">全部表示する</button></div>
<div id="stage"><div id="empty"></div></div>
<div id="t-side"><div class="sideGrip" title="つかんで左右に動かすと幅が変わります（ダブルクリックで動画にぴったりの幅に戻る）"></div>
  <div class="sideHead"><span class="st">トーナメント表</span><button id="sideClose" title="閉じる（T キー）">✕ 閉じる</button></div>
  <div class="sg"><div class="sgBar"></div><div class="sgBody"></div><div class="sgFoot"></div></div></div>
<div id="toast"></div>
<div id="fileWarn" style="display:none;position:fixed;inset:0;z-index:100;background:rgba(11,12,14,.97);color:#f1f2f4;align-items:center;justify-content:center;text-align:center;line-height:2;font-size:16px">
  <div>このファイルを直接開くと、YouTube の決まりで動画が再生できません（エラー 153）。<br>
  <b>同じフォルダの「<span id="batName"></span>」をダブルクリック</b>して開いてください。<br>
  <span id="fileWarnSub" style="color:#9ba2ab;font-size:13px">サーバーが動いているか確かめています…</span></div>
</div>

<script>
// ===== 版ごとの設定（反映するときはここだけ変える）=====
// テスト版：8791・公開版へは移らない／いつもの版：8790・止まっていれば公開版へ
const LOCAL_URL = 'http://localhost:8790/';
const PUBLIC_URL = 'https://maze-beaver.github.io/yt-multi-viewer/';
const BAT_NAME = '起動する.bat';
const IS_TEST = false;

// ファイルを直接開いたとき（file://）は YouTube がエラー153で断るので、PC内のサーバーの画面へ移る
if (location.protocol === 'file:') {
  document.getElementById('fileWarn').style.display = 'flex';
  document.getElementById('batName').textContent = BAT_NAME;
  fetch(LOCAL_URL, { mode: 'no-cors' }).then(() => location.replace(LOCAL_URL)).catch(() => {
    if (PUBLIC_URL) {   // サーバーが止まっていたら、サーバーのいらない公開版へ移る（2026-11-22）
      document.getElementById('fileWarnSub').textContent = 'サーバーが動いていないので、公開版の画面へ移ります…';
      location.replace(PUBLIC_URL);
    } else {
      document.getElementById('fileWarnSub').textContent = `サーバーが動いていません。「${BAT_NAME}」をダブルクリックすると、自動で正しい画面が開きます。`;
    }
  });
}
if (!IS_TEST) { document.getElementById('testBadge').remove(); document.title = 'YouTube 複数画面'; }

(() => {
  const MAX = 8, GAP = 3, KEY = 'ytmulti.state.v1', PKEY = 'ytmulti.presets.v1', TOKEN_KEY = 'ytmulti.startgg.token';
  const $ = (s) => document.querySelector(s);
  const stage = $('#stage');
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---------- 種類 ----------
  // yt＝YouTube／tw＝Twitch（ch＝チャンネル・vod＝録画）／sg＝start.gg のトーナメント表（slug＝tournament/〇/event/〇）
  const isMedia = (t) => t.kind === 'yt' || t.kind === 'tw';
  const okVid = (v) => typeof v === 'string' && /^[\w-]{11}$/.test(v);
  const okCh = (v) => typeof v === 'string' && /^[A-Za-z0-9_]{2,25}$/.test(v);
  const okVod = (v) => typeof v === 'string' && /^\d{1,12}$/.test(v);
  const okTime = (v) => typeof v === 'string' && /^(\d{1,3}h)?(\d{1,3}m)?(\d{1,3}s)?$/.test(v);
  const okSlug = (v) => typeof v === 'string' && /^tournament\/[\w-]{1,120}(\/event\/[\w-]{1,120})?$/.test(v);
  const okId = (v) => typeof v === 'string' && /^\d{1,12}$/.test(v);
  const kindOf = (t) => t && (t.kind === 'tw' || t.kind === 'sg') ? t.kind : 'yt';   // 古い保存データは YouTube
  const okTile = (t) => {
    if (!t) return false;
    const k = kindOf(t);
    if (k === 'yt') return okVid(t.vid);
    if (k === 'tw') return okCh(t.ch) || okVod(t.vod);
    return false;   // トーナメント表は枠ではなくサイドバー（state.side）
  };

  // ---------- 保存 ----------
  const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } };
  const pick = (t) => {
    const k = kindOf(t), o = { kind: k, title: t.title, hidden: t.hidden };
    if (k === 'yt') Object.assign(o, { vid: t.vid, start: t.start });
    if (k === 'tw') Object.assign(o, okCh(t.ch) ? { ch: t.ch } : { vod: t.vod, time: t.time });
    if (k === 'sg') Object.assign(o, { slug: t.slug, sgPhase: t.sgPhase, sgGroup: t.sgGroup, sgSide: t.sgSide, sgZoom: t.sgZoom, sgProj: !!t.sgProj });
    return o;
  };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify({
    tiles: state.tiles.map(t => ({ key: t.key, vol: t.vol, muted: !!t.muted, ...pick(t) })),   // 音のオン/オフも覚える（開き直したとき元のとおり鳴らす）
    layout: state.layout, barHidden: state.barHidden,
    side: { open: state.side.open, width: state.side.width, manual: !!state.side.manual, dragW: state.side.dragW || 0, ...pick(state.side) } })); } catch {} };
  const newKey = (i = 0) => 'k' + Date.now().toString(36) + i + Math.random().toString(36).slice(2, 6);
  const cleanTile = (t, i) => {
    const k = kindOf(t);
    const o = { key: typeof t.key === 'string' && /^[\w]{1,40}$/.test(t.key) ? t.key : newKey(i), kind: k,
      vol: Math.min(100, Math.max(0, parseInt(t.vol ?? 100, 10) || 0)),
      hidden: !!t.hidden, title: typeof t.title === 'string' ? t.title.slice(0, 300) : '', muted: true };   // ここではミュート。開き直したときの音は下の「音を戻す」で決める
    if (k === 'yt') Object.assign(o, { vid: t.vid, start: Math.max(0, parseInt(t.start, 10) || 0) });
    if (k === 'tw') Object.assign(o, okCh(t.ch) ? { ch: t.ch } : { vod: t.vod, time: okTime(t.time) ? t.time : '' });
    if (k === 'sg') Object.assign(o, { slug: okSlug(t.slug) ? t.slug : '', sgPhase: okId(t.sgPhase) ? t.sgPhase : '', sgGroup: okId(t.sgGroup) ? t.sgGroup : '',
      sgSide: ['w', 'l'].includes(t.sgSide) ? t.sgSide : 'w', sgZoom: Math.min(1.6, Math.max(0.5, +t.sgZoom || 1)), sgProj: t.sgProj === true, sgFind: '' });
    return o;
  };
  const saved = load(KEY, {});
  const state = {
    tiles: (Array.isArray(saved.tiles) ? saved.tiles : []).filter(okTile).slice(0, MAX).map(cleanTile)
      .map((t, i, arr) => arr.findIndex(x => x.key === t.key) < i ? { ...t, key: newKey(i) } : t),   // 同じ key が2つあれば作り直す
    layout: saved.layout === 'equal' ? 'equal' : 'focus',   // 'equal'＝全部同じ／'focus'＝1つ大きく（1番の位置が大）
    barHidden: !!saved.barHidden,
    // トーナメント表のサイドバー（key は 'side' 固定・中身の形は start.gg の枠と同じ）
    side: { ...cleanTile({ ...(saved.side && typeof saved.side === 'object' ? saved.side : {}), kind: 'sg', key: 'side' }, 0), key: 'side',
      // width：0＝画面の半分（はじめ・2026-11-22 本人「最初開いたタイミングでは画面の半分」）／左の端をつかんで動かすとその幅を覚える
      open: !!saved.side?.open, manual: saved.side?.manual ?? !!saved.side?.width, dragW: parseInt(saved.side?.dragW, 10) || 0, width: Math.min(3000, Math.max(0, parseInt(saved.side?.width, 10) || 0)),
      // mode：いつも 'sg'（X はサイドバーに入れず、帯の X ボタンで新しいタブに開く・2026-11-22）
      mode: 'sg' },
  };
  // 音を戻す（2026-11-22 本人「画面を更新したときに、もともと音が鳴ってた画面だけ音が鳴るように。最初に開くなら1番だけ鳴る」）
  (() => {
    const raw = Array.isArray(saved.tiles) ? saved.tiles : [];
    if (raw.some(x => x && typeof x.muted === 'boolean')) {
      state.tiles.forEach(t => { const r = raw.find(x => x && x.key === t.key); if (r && r.muted === false && !t.hidden) t.muted = false; });
    } else soundFirstOnly();
  })();
  const savedPresets = load(PKEY, []);
  let presets = (Array.isArray(savedPresets) ? savedPresets : []).filter(p => p && typeof p.name === 'string' && Array.isArray(p.tiles));
  const players = {};   // key → { mute, unMute, setVolume(0-100), play, pause, playing, destroy, p }
  const tileEl = (key) => document.getElementById('t-' + key);
  const findTile = (key) => state.tiles.find(t => t.key === key);
  let apiReady = false, twReady = false, twLoading = false;

  // ---------- URL を読む ----------
  const TW_RESERVED = new Set(['directory', 'videos', 'settings', 'search', 'downloads', 'p', 'jobs', 'turbo', 'prime', 'subscriptions', 'inventory',
    'wallet', 'drops', 'friends', 'messages', 'login', 'signup', 'legal', 'store', 'products', 'broadcast', 'moderator', 'popout', 'team', 'collections',
    'following', 'bits', 'privacy', 'security', 'partners', 'clip', 'clips', 'embed', 'u', 'dashboard', 'creatorcamp']);
  function parse(text) {
    text = text.trim();
    if (!text) return null;
    if (/^[\w-]{11}$/.test(text)) return { kind: 'yt', vid: text, start: 0 };
    let u;
    try { u = new URL(text.startsWith('http') ? text : 'https://' + text); } catch { return null; }
    if (u.protocol !== 'https:' && u.protocol !== 'http:') return null;
    const host = u.hostname.toLowerCase().replace(/^www\.|^m\./, '');
    // --- Twitch ---
    if (host === 'twitch.tv' || host === 'player.twitch.tv') {
      if (host === 'player.twitch.tv') {
        const ch = u.searchParams.get('channel'), v = (u.searchParams.get('video') || '').replace(/^v/, '');
        if (okCh(ch || '') && !TW_RESERVED.has(ch.toLowerCase())) return { kind: 'tw', ch };
        if (okVod(v)) return { kind: 'tw', vod: v, time: okTime(u.searchParams.get('time') || '') ? u.searchParams.get('time') : '' };
        return null;
      }
      const seg = u.pathname.split('/').filter(Boolean);
      if (seg[0] === 'videos' && okVod(seg[1] || '')) {
        const tt = u.searchParams.get('t') || '';
        return { kind: 'tw', vod: seg[1], time: okTime(tt) ? tt : '' };
      }
      if (seg.length === 1 && okCh(seg[0]) && !TW_RESERVED.has(seg[0].toLowerCase())) return { kind: 'tw', ch: seg[0] };
      return null;
    }
    // --- start.gg（旧 smash.gg）---
    if (host === 'start.gg' || host === 'smash.gg') {
      const m = u.pathname.match(/^\/tournament\/([\w-]{1,120})(?:\/event\/([\w-]{1,120}))?(?:\/brackets\/(\d{1,12})(?:\/(\d{1,12}))?)?/);
      if (!m) return null;
      return { kind: 'sg', slug: `tournament/${m[1]}` + (m[2] ? `/event/${m[2]}` : ''), sgPhase: m[2] && m[3] ? m[3] : '', sgGroup: m[2] && m[4] ? m[4] : '' };
    }
    // --- YouTube ---
    let vid = null;
    if (host === 'youtu.be') { const m = u.pathname.match(/^\/([\w-]{11})\/?$/); if (m) vid = m[1]; }
    else if (host === 'youtube.com' || host.endsWith('.youtube.com') || host === 'youtube-nocookie.com') {
      if (u.searchParams.get('v') && u.pathname === '/watch') vid = u.searchParams.get('v');
      else { const m = u.pathname.match(/^\/(?:live|shorts|embed|v)\/([\w-]{11})/); if (m) vid = m[1]; }
    }
    if (!vid || !/^[\w-]{11}$/.test(vid)) return null;
    const t = u.searchParams.get('t') || u.searchParams.get('start') || '0';
    let start = 0; const mm = String(t).match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?/);
    if (/^\d+$/.test(t)) start = +t; else if (mm) start = (+mm[1] || 0) * 3600 + (+mm[2] || 0) * 60 + (+mm[3] || 0);
    return { kind: 'yt', vid, start };
  }

  // ---------- 追加・削除 ----------
  function addTile(p, i = 0) {
    const t = cleanTile({ ...p, key: newKey(i), vol: 100, hidden: false, title: '' }, i);
    state.tiles.push(t); makeTile(t);
    return t;
  }
  function addFromInput() {
    const tokens = $('#url').value.split(/\s+/).filter(Boolean);
    if (!tokens.length) return;
    let added = 0, bad = 0, full = false;
    let sideUrl = null;
    const wasEmpty = !state.tiles.some(isMedia);
    tokens.forEach((tk, i) => {
      const p = parse(tk);
      if (!p) { bad++; return; }
      if (p.kind === 'sg') { sideUrl = tk; return; }   // start.gg はサイドバーに出す
      if (state.tiles.length >= MAX) { full = true; return; }
      addTile(p, i); added++;
    });
    if (sideUrl) { state.side.mode = 'sg'; setSide(true, true); sgSetUrl(state.side, sideUrl); }   // 古い大会は読まずに、新しい大会だけ読む
    if (wasEmpty && added) { soundFirstOnly(); state.tiles.forEach(t => { if (!t.muted) setMuted(t.key, false, true); }); }   // 何もないところに足したら1番だけ鳴らす
    $('#url').value = '';
    const msg = [];
    if (added) msg.push(`${added} 枠 追加しました`);
    if (bad) msg.push(`${bad} 件は読めませんでした（YouTube は配信そのものの URL、Twitch は twitch.tv/チャンネル名 か twitch.tv/videos/番号、start.gg は大会の URL を貼ってください）`);
    if (full) msg.push('8 枠までです');
    if (msg.length) toast(msg.join('　'), bad ? 7000 : 3500);
    render(); save();
  }
  // トーナメント表のサイドバーを出す・しまう（しまっている間は読みに行かない）
  function setSide(open, noLoad) {
    state.side.open = open;
    if (!open) { sgTip(null); const s = sgCancel(state.side); s.tried = 0; }   // 閉じたら説明の箱も消す（Codex 指摘）。閉じたら読みかけをやめる（開き直したらすぐ読めるように、待ち時間も戻す）
    render(); save();
    if (open && !noLoad && state.side.mode === 'sg') { sgDraw(state.side); sgRefreshIfOld(state.side); }
  }
  const addBracket = () => setSide(!state.side.open);
  // X はいつもの Chrome の新しいタブで開く（2026-11-22 本人「本当にできないんだったら、ブラウザ内で新しく X を開くだけでもいい」。
  // x.com はほかのページの中に入れられない作り＝X-Frame-Options のため、サイドバーには入れない）
  const openX = () => window.open('https://x.com/home', '_blank', 'noopener,noreferrer');
  // 幅は左の端をつかんで変える
  function startSize(e) {
    if (e.button !== 0) return;
    e.preventDefault();
    document.body.classList.add('sizing');
    const mv = (ev) => { state.side.manual = true; state.side.dragW = innerWidth; state.side.width = Math.round(Math.min(Math.max(300, innerWidth - ev.clientX), Math.max(300, innerWidth - 320))); render(); };
    // 離した・取り消された（pointercancel）のどちらでも、同じ後始末をする（Codex 指摘・取り残し防止）
    const up = () => {
      document.body.classList.remove('sizing');
      window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
      save();
    };
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  }
  function destroyPlayer(key) {
    try { players[key]?.destroy?.(); } catch {}
    delete players[key];
  }
  // 枠を1つ外す（quiet＝まとめて外すとき。描き直し・保存は呼んだ側が最後に1回）
  function removeTile(key, quiet) {
    const i = state.tiles.findIndex(t => t.key === key); if (i < 0) return;
    destroyPlayer(key);
    tileEl(key)?.remove();
    state.tiles.splice(i, 1);
    if (!quiet) { render(); save(); }
  }

  // ---------- 画面（タイル）を作る ----------
  function openUrl(t) {
    if (t.kind === 'yt') return `https://www.youtube.com/watch?v=${t.vid}`;
    if (t.kind === 'tw') return t.ch ? `https://www.twitch.tv/${t.ch}` : `https://www.twitch.tv/videos/${t.vod}`;
    return t.slug ? `https://www.start.gg/${t.slug}` : 'https://www.start.gg/';
  }
  function makeTile(t) {
    const el = document.createElement('div');
    el.className = 'tile'; el.id = 't-' + t.key;   // 枠は YouTube・Twitch だけ（トーナメント表はサイドバー）
    const site = t.kind === 'tw' ? 'Twitch' : 'YouTube';
    el.innerHTML = `
      <div class="frame"><div id="p-${t.key}"></div></div>
      <div class="err"><div class="msg">この動画はここでは再生できません</div><a target="_blank" rel="noopener" href="${esc(openUrl(t))}">${site} で開く</a></div>
      <div class="ctl">
        <span class="handle" title="押す＝この画面を1番（大きい画面）にする／長押しでつかんで、ほかの画面に落とす＝場所の入れかえ"><span class="grip">✥</span><span class="num"></span><span class="spk"></span><span class="mv">押す＝1番・長押し＝移動</span></span>
        <div class="rest">
          <button class="snd" title="音のオン/オフ"><span class="ico">🔇</span><span class="lbl"> 音</span></button>
          <button class="solo" title="この画面だけ鳴らす">🎯<span class="lbl"> これだけ鳴らす</span></button>
          <input class="vol" type="range" min="0" max="100" value="${t.vol}" title="音量">
          <span class="name"></span>
          <button class="hide" title="隠す（外さない）">👁<span class="lbl"> 隠す</span></button>
          <button class="x" title="外す">✕</button>
        </div>
      </div>`;
    stage.appendChild(el);
    el.querySelector('.snd').onclick = () => setMuted(t.key, !t.muted);
    el.querySelector('.solo').onclick = () => solo(t.key);
    el.querySelector('.vol').oninput = (e) => { t.vol = +e.target.value; try { players[t.key]?.setVolume(t.vol); } catch {} save(); };
    el.querySelector('.hide').onclick = () => setHidden(t.key, true);
    el.querySelector('.x').onclick = () => removeTile(t.key);
    const handle = el.querySelector('.handle');
    handle.addEventListener('pointerdown', (e) => startDrag(e, t.key));
    handle.addEventListener('contextmenu', (e) => e.preventDefault());   // 指で長押ししたときに出るメニューを止める
    if (t.kind === 'yt') { if (apiReady) makePlayer(t); }
    else if (twReady) makeTw(t); else loadTwitch();
  }
  // 枠の中に「再生できません」を出す
  function showTileErr(key, msg) {
    const el = tileEl(key); if (!el) return;
    el.querySelector('.err .msg').textContent = msg;
    el.classList.add('hasErr');
  }

  // --- YouTube ---
  function makePlayer(t) {
    if (players[t.key]) return;
    const p = new YT.Player('p-' + t.key, {
      // 2026-11-22 本人「Premium なのに広告が流れる。自分のアカウントで再生されるように」→ nocookie（ログインを使わない）をやめて youtube.com にする
      host: 'https://www.youtube.com',
      videoId: t.vid, width: '100%', height: '100%',
      playerVars: { autoplay: t.hidden ? 0 : 1, mute: 1, playsinline: 1, rel: 0, start: t.start || 0, origin: location.origin },
      events: {
        onReady: (e) => {
          const p = e.target;
          try { p.setVolume(t.vol); t.muted ? p.mute() : p.unMute(); (t.hidden || t.stopped) ? p.pauseVideo() : p.playVideo(); } catch {}
          if (!t.muted) checkSound(t);   // 準備中に隠した・全部停止したものも止める
          updateTitle(t);
        },
        onStateChange: () => { updateTitle(t); updatePlayBtn(); },
        onError: (e) => {
          const code = e.data;
          const msg = (code === 101 || code === 150) ? '配信者が埋め込みを許可していないため、ここでは再生できません'
            : (code === 100 || code === 5) ? '動画が見つからないか、非公開・削除されています'
            : code === 2 ? 'URL がまちがっているようです'
            : code === 153 ? `ファイルを直接開いているため再生できません。「${BAT_NAME}」から開いてください`
            : `再生できませんでした（コード ${code}）`;
          showTileErr(t.key, msg);
        },
      },
    });
    players[t.key] = {
      p, mute: () => p.mute(), unMute: () => p.unMute(), setVolume: (v) => p.setVolume(v), isMuted: () => p.isMuted(),
      play: () => p.playVideo(), pause: () => p.pauseVideo(),
      playing: () => { const s = p.getPlayerState?.(); return s === 1 || s === 3; },
      destroy: () => p.destroy(),
    };
  }
  function updateTitle(t) {
    if (t.title || t.kind !== 'yt') return;
    try { const d = players[t.key]?.p?.getVideoData?.(); if (d && d.title) { t.title = d.title; render(); save(); } } catch {}
  }

  // --- Twitch（公式の埋め込み。parent にこのページの名前を渡す決まり）---
  function loadTwitch() {
    if (twLoading) return; twLoading = true;
    const s = document.createElement('script'); s.src = 'https://player.twitch.tv/js/embed/v1.js';
    s.onload = () => { twReady = true; state.tiles.filter(t => t.kind === 'tw').forEach(makeTw); };
    s.onerror = () => { twLoading = false; toast('Twitch の読み込みに失敗しました。ネットのつながりを確かめて、開き直してください', 6000); };
    document.head.appendChild(s);
  }
  function makeTw(t) {
    if (players[t.key] || !document.getElementById('p-' + t.key)) return;
    if (!t.title) t.title = t.ch ? t.ch : `Twitch の録画 ${t.vod}`;

    if (e.repeat && !arrow) return;   // 押しっぱなしで出す・しまうがくり返されないように（← → だけはくり返してよい）
    if (/^[1-8]$/.test(e.key)) { const t = visible()[+e.key - 1]; if (t) solo(t.key); }
    else if (e.key === '0') toggleAllSound();
    else if (e.key === 'p' || e.key === 'P') togglePlayAll();
    else if (e.key === 'e' || e.key === 'E') setLayout(state.layout === 'focus' ? 'equal' : 'focus');
    else if (e.key === 'h' || e.key === 'H') toggleBar();
    else if (e.key === 't' || e.key === 'T') addBracket();
    else if (arrow && state.side.open && state.side.mode === 'sg') { e.preventDefault(); sgStepPool(state.side, e.key === 'ArrowRight' ? 1 : -1); }
    else if (e.key === 'Escape') { $('#hiddenPop').classList.remove('on'); closeMore(true); }
  });
  // 動画を押すとキーが YouTube・Twitch 側に取られるので、すぐこちらに戻す（数字キーで切りかえられるように）
  window.addEventListener('blur', () => setTimeout(() => {
    if (document.activeElement && document.activeElement.tagName === 'IFRAME') { document.activeElement.blur(); window.focus(); }
  }, 0));

  // ---------- 始める ----------
  state.tiles.forEach(makeTile);
  $('#sideClose').onclick = () => setSide(false);
  $('#openX').onclick = openX;
  $('#t-side .sideGrip').addEventListener('pointerdown', startSize);
  renderPresets(); render();
  sgInit(state.side, $('#t-side'));
  window.onYouTubeIframeAPIReady = () => { apiReady = true; state.tiles.filter(t => t.kind === 'yt').forEach(makePlayer); };
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
  window.__ytmulti = { state, players, render, swap, focusRects, gridRects, parse, sg, sgColumns };   // 確かめ用
})();
</script>
